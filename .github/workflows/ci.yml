name: CI

on:
  push:
    branches: [ master ]
    tags:
      - '*'
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Clean leftover virtual environment
      run: |
        rm -rf venv


    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3-gpg \
          python3-venv \
          libgirepository1.0-dev \
          libgirepository-2.0-dev \
          libgtk-4-dev \
          libgstreamer1.0-dev \
          libgstreamer-plugins-base1.0-dev \
          gstreamer1.0-plugins-good \
          gstreamer1.0-plugins-bad \
          gir1.2-gtk-4.0 \
          gir1.2-adw-1 \
          gir1.2-gst-plugins-base-1.0 \
          libgpgme-dev \
          gpg \
          xvfb \
          libcairo2-dev \
          pkg-config \
          libdbus-1-dev

    - name: Create the virtual environment
      # Built by the system interpreter, so that the gpgme extension
      # borrowed below is the matching build.
      run: |
        python3 -m venv venv
        venv/bin/python -m pip install --upgrade pip setuptools wheel

    - name: Install Python dependencies
      run: |
        PKG_CONFIG_PATH="/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig" venv/bin/pip install pygobject dbus-python pillow
        venv/bin/pip install -r requirements.txt
        venv/bin/pip install babel BabelGladeExtractor
        venv/bin/pip install .[test]

    - name: Borrow the gpgme bindings from the distro
      # PyPI's gpg builds an extension that cannot be imported at all, and
      # sharing all of dist-packages shadows the pinned zope-interface.
      run: |
        SITE=$(venv/bin/python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
        ln -sf /usr/lib/python3/dist-packages/gpg "$SITE/gpg"
        venv/bin/python -c "import gpg; print('gpgme bindings:', gpg.version.versionstr)"


    - name: Compile translation catalogs
      run: |
        venv/bin/python setup.py compile_catalog

    - name: Test translation round-trip
      run: |
        venv/bin/python setup.py extract_messages
        venv/bin/python setup.py update_catalog

    - name: Run test suite
      # As a module, not venv/bin/pytest: with --system-site-packages pip
      # leaves pytest out of the venv when the system already has it, and
      # then there is no such script to run.
      run: |
        xvfb-run venv/bin/python -m pytest

    - name: Build sdist and egg
      run: |
        venv/bin/python setup.py sdist bdist_egg

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: gnome-keysign-release-packages
        path: dist/

  check-version-tag:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Verify _version.py matches git tag
      run: |
        TAG="${GITHUB_REF#refs/tags/}"
        FILE_VERSION=$(python -c "exec(open('keysign/_version.py').read()); print(__version__)")
        echo "Git tag:       $TAG"
        echo "File version:  $FILE_VERSION"
        if [ "$TAG" != "$FILE_VERSION" ]; then
          echo "ERROR: git tag '$TAG' does not match keysign/_version.py version '$FILE_VERSION'"
          exit 1
        fi
        echo "Versions match."

  release-wheel:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: check-version-tag
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libgirepository1.0-dev \
          libgirepository-2.0-dev \
          libgtk-4-dev \
          libgstreamer1.0-dev \
          libgstreamer-plugins-base1.0-dev \
          libgpgme-dev \
          libcairo2-dev \
          pkg-config \
          libdbus-1-dev

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip build setuptools wheel babel BabelGladeExtractor
        PKG_CONFIG_PATH="/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig" pip install pygobject

    - name: Generate translated .desktop and .appdata.xml
      # BuildWithCompile.run() translates the .raw.* files into the final
      # data/org.gnome.Keysign.desktop and .appdata.xml that MANIFEST.in
      # expects to find.  Running a dummy build triggers it without
      # actually installing anything.
      run: python setup.py build

    - name: Compile translation catalogs (.mo files)
      run: python setup.py compile_catalog

    - name: Build sdist and wheel
      # --no-isolation keeps the build in the current environment so the
      # pre-generated .mo, .desktop and .appdata.xml files (which are not
      # in git) are present when the sdist is assembled.
      run: python -m build --no-isolation

    - name: Verify dist contents
      run: |
        echo "=== dist/ ===" && ls -lh dist/
        echo "=== wheel contents ===" && python -m zipfile -l dist/*.whl | grep -E '(\.mo|\.desktop|\.appdata)' || echo "WARNING: expected files not found in wheel"

    - name: Upload wheel to GitHub release
      uses: softprops/action-gh-release@v3
      with:
        files: dist/*

